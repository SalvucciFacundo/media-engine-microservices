services:
  postgres:
    image: postgres:16-alpine
    container_name: media-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: media_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: media-engine-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      target: gateway
    container_name: media-engine-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/media_engine?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      STORAGE_DIR: "/app/storage/uploads"
      DEFAULT_TTL: "1h"
      JANITOR_INTERVAL: "5m"
    volumes:
      - shared_storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    container_name: media-engine-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/media_engine?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      STORAGE_DIR: "/app/storage/uploads"
      WORKER_QUEUE_GROUP: "worker-engine-group"
    volumes:
      - shared_storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:
  shared_storage:
